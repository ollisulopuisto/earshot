[project]
name = "earshot"
version = "0.1.0"
description = "Measure, then restore: a bench for speech restoration on podcast voices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Olli Sulopuisto" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# The VST3 engine. Optional because the bench itself must run in CI, where
# no plug-in is installed and none can be.
vst3 = ["pedalboard>=0.9"]
# PESQ and STOI. Optional because they are the metrics of the literature
# rather than of this bench: they exist so our numbers can be held against a
# paper's, and the bench must still run without them.
perceptual = ["pesq>=0.0.4", "pystoi>=0.4"]
# LavaSR. onnxruntime only -- the inference itself is vendored numpy, and
# the weights are fetched and checksummed rather than shipped.
lavasr = ["onnxruntime>=1.17", "pyyaml>=6.0"]
# DeepFilterNet's own code, which needs PyTorch. Heavy, and deliberately so:
# its inference is stateful and hand-porting it would turn a bug into a
# quality difference rather than a crash.
deepfilternet = ["deepfilternet>=0.5", "torch>=2.0", "torchaudio>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
earshot = "earshot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot"]
# Vendattu konfiguraatio ja lisenssi kuuluvat pakettiin, eivät vain repoon.
artifacts = ["src/earshot/vendor/*.yaml", "src/earshot/vendor/LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
