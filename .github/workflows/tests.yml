name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Bare runner on purpose: no models, no plug-ins, no ffmpeg. If the bench
    # cannot run here, it cannot run on a contributor's laptop either, and a
    # probe that silently needs something must fail rather than skip unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
        # No weights are fetched in CI. An engine that cannot say so without
        # reaching the network is an engine that will surprise a contributor.
      - run: uv run pytest -q
        env:
          EARSHOT_NO_DOWNLOAD: "1"
      - name: native bridge safety and worker handoff (no plugin bundle or models)
        run: |
          git clone --quiet https://github.com/free-audio/clap.git "$RUNNER_TEMP/clap"
          git -C "$RUNNER_TEMP/clap" checkout --quiet 69a69252fdd6ac1d06e246d9a04c0a89d9607a17
          CLAP_INCLUDE_DIR="$RUNNER_TEMP/clap/include" plugin/earshot_bridge/tests/run_native.sh
      - name: the bench must run with nothing installed
        run: uv run earshot bench --seconds 4 --damage clean --damage narrowband-voip
