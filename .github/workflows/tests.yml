name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Bare runner on purpose: no models, no plug-ins, no ffmpeg. If the bench
    # cannot run here, it cannot run on a contributor's laptop either, and a
    # probe that silently needs something must fail rather than skip unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
        # No weights are fetched in CI. An engine that cannot say so without
        # reaching the network is an engine that will surprise a contributor.
      - run: uv run pytest -q
        env:
          EARSHOT_NO_DOWNLOAD: "1"
      - name: the bench must run with nothing installed
        run: uv run earshot bench --seconds 4 --damage clean --damage narrowband-voip
